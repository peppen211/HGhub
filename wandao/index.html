<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121214"><title>萬道仙途：天道異界</title>
<style>
:root{--ink:#121214;--panel:#1b1a1b;--panel2:#242122;--line:#514238;--gold:#d4a373;--red:#9e2a2b;--jade:#2a9d8f;--muted:#b5a99d;--safe:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:#09090b;color:#f1e7da;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}body{overscroll-behavior:none}button{font:inherit;color:inherit;border:0;cursor:pointer}button:disabled{opacity:.4}
.app{width:min(100%,520px);height:100dvh;min-height:560px;margin:auto;position:relative;overflow:hidden;background:linear-gradient(180deg,#211c1b,#101012 60%);padding-bottom:calc(72px + var(--safe))}
.top{height:86px;padding:calc(10px + env(safe-area-inset-top)) 16px 8px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(180deg,#171416,#171416dd);border-bottom:1px solid #49392d}
.brand{font-size:18px;font-weight:900;letter-spacing:2px;color:var(--gold)}.realm{font-size:11px;color:#c7b6a2;margin-top:3px}.power{text-align:right;font-size:12px;color:#d8c7b2}.power b{display:block;font-size:19px;color:#f1d4a8}
.view{height:calc(100% - 86px);overflow:auto;padding:12px 13px 16px;scrollbar-width:none}.view::-webkit-scrollbar{display:none}
.hero-scene{height:300px;position:relative;overflow:hidden;border:1px solid #6d5036;border-radius:16px;background:#17191c;box-shadow:0 8px 30px #0009}
.scene-art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scene-shade{position:absolute;inset:0;background:linear-gradient(180deg,#08090a30 0%,#09090a05 40%,#0b090be8 100%)}
.hero-name{position:absolute;left:15px;top:14px;text-shadow:0 2px 8px #000;font-size:14px;color:#f0d8b2}.hero-name strong{font-size:19px;display:block}
.hero-figure{position:absolute;left:50%;top:50%;transform:translate(-50%,-43%);height:76%;width:auto;filter:drop-shadow(0 5px 14px #000);font-size:0}
.hero-figure svg,.hero-figure img{height:100%;width:auto;object-fit:contain}.asset-sprite{display:block;object-fit:contain;filter:drop-shadow(0 5px 12px #000)}.pet-mini img{width:100%;height:100%;object-fit:contain;padding:4px}.fighter .sigil{height:118px;display:grid;place-items:center}.fighter .sigil img{max-height:118px;max-width:100%;object-fit:contain;filter:drop-shadow(0 4px 12px #000)}
.pet-mini{position:absolute;right:14px;bottom:45px;width:68px;height:68px;border-radius:50%;border:1px solid #c49a68;background:radial-gradient(circle,#e3c18b,#54372a 70%);display:grid;place-items:center}
.pet-mini svg{width:58px;height:58px}.mount-label{position:absolute;left:14px;bottom:17px;color:#e4c99e;font-size:11px}
.stat-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0}
.stat{background:#211d1c;border:1px solid #44372e;border-radius:10px;padding:9px 8px;text-align:center}.stat small{display:block;color:var(--muted);font-size:10px}.stat b{font-size:15px;color:#f0d1a1}
.section-title{display:flex;align-items:center;justify-content:space-between;margin:15px 2px 9px;font-weight:800;color:#e8c99c}.section-title small{font-size:10px;color:#9e8d7c;font-weight:500}
.primary{background:linear-gradient(135deg,#b54b38,#772321);border:1px solid #d28a5c;border-radius:12px;padding:13px 18px;font-weight:900;letter-spacing:1px;box-shadow:0 4px 14px #0008}.secondary{background:#292322;border:1px solid #66513d;border-radius:10px;padding:9px 12px;color:#e7cda9}
.dungeon{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px;background:linear-gradient(110deg,#34221e,#171719);border:1px solid #82543c;border-radius:13px;text-align:left}.dungeon b{display:block;color:#f1d0a0;font-size:15px}.dungeon small{color:#bca995;font-size:10px}
.quick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.quick{background:#211e1d;border:1px solid #4a3b30;border-radius:11px;padding:10px 5px;text-align:center;font-size:12px;color:#e7d3b8}.quick .glyph{display:block;font-size:24px;color:var(--gold);margin-bottom:5px}
.nav{position:absolute;bottom:0;left:0;right:0;height:calc(66px + var(--safe));padding:6px 10px var(--safe);display:grid;grid-template-columns:repeat(4,1fr);background:#151315f5;border-top:1px solid #554333;z-index:5}
.nav button{background:none;color:#998b7d;font-size:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}.nav button span{font-size:20px;color:#b69a78}.nav button.active{color:#f0d1a1}.nav button.active span{color:#e0ae70}
.panel{background:#201d1d;border:1px solid #4b3b30;border-radius:13px;padding:12px;margin-bottom:10px}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.muted{color:#a99a8b;font-size:11px}.tabs{display:flex;gap:6px;overflow:auto;margin:0 0 12px}.tabs button{white-space:nowrap;background:#242020;border:1px solid #514236;border-radius:9px;padding:8px 12px;font-size:12px;color:#c4b4a2}.tabs button.on{background:#62402c;border-color:#d4a373;color:#ffe0b3}
.item-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.item{background:#242020;border:1px solid #4d4035;border-radius:12px;padding:10px;min-height:122px}.item h3{font-size:13px;color:#f0d0a2;margin:6px 0}.item p{font-size:10px;color:#b5a99d;line-height:1.5;margin:0 0 8px}.item .art{height:48px;font-size:32px;color:#d5ad7c;display:grid;place-items:center;background:radial-gradient(circle,#59402d,#292020 70%);border-radius:8px}
.slot-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.slot{padding:12px 4px;text-align:center;border:1px solid #584535;border-radius:10px;background:#282322;font-size:11px}.slot b{display:block;color:#e6c394;margin-bottom:5px}
.bar{height:7px;background:#433b35;border-radius:8px;overflow:hidden;margin:7px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,#2a9d8f,#9bc9a7)}
.battle{position:absolute;inset:0;background:#111;z-index:10;display:none;flex-direction:column;padding:calc(14px + env(safe-area-inset-top)) 14px calc(14px + var(--safe))}.battle.show{display:flex}
.battle-scene{position:relative;flex:1;min-height:250px;border:1px solid #77573d;border-radius:16px;overflow:hidden;background:linear-gradient(#202b31,#171312 75%)}.battle-scene svg{width:100%;height:100%}
.battle-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;color:#e8c99c}.combatants{display:flex;justify-content:space-around;align-items:center;position:absolute;inset:18% 4% 12%}.fighter{width:34%;text-align:center}.fighter .sigil{font-size:64px;filter:drop-shadow(0 3px 8px #000)}.fighter small{display:block;color:#f2d8b1}.battle-log{height:65px;text-align:center;padding:10px;color:#e5c79d;font-size:13px}.battle-actions{display:flex;gap:8px}.battle-actions button{flex:1}.modal{position:absolute;inset:0;background:#000b;z-index:20;display:none;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.modal-card{width:100%;max-width:390px;background:linear-gradient(160deg,#30251f,#171516);border:1px solid #d0a16d;border-radius:17px;padding:18px;box-shadow:0 15px 60px #000}.modal-card h2{color:#f1d0a1;margin:0 0 7px;font-size:19px}.choice{width:100%;text-align:left;margin-top:9px;background:#292322;border:1px solid #66503d;border-radius:11px;padding:12px}.choice b{display:block;color:#f0d0a0}.choice small{color:#b9a998}
.hidden{display:none!important}
</style>

<style>
/* battle polish */
.battle-scene{background:radial-gradient(ellipse at 50% 72%,#71513b 0%,#28302f 38%,#121416 78%);isolation:isolate}
.battle-scene:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#18232988,transparent 48%,#09090be8),repeating-linear-gradient(115deg,transparent 0 38px,#c5a06b0b 39px 40px);pointer-events:none}
.combatants{z-index:1}.fighter .sigil img{max-height:100%;max-width:100%;width:auto;height:118px;object-fit:contain;animation:floatSpirit 2.8s ease-in-out infinite;filter:drop-shadow(0 8px 14px #000)}
.fighter:last-child .sigil img{animation-delay:-1.1s}
.fighter.strike{animation:dashStrike .28s ease-in-out}.fighter.hit{animation:hitFlash .22s}
.battle-scene.critical{animation:criticalShake .24s}
@keyframes floatSpirit{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes dashStrike{0%{transform:translateX(0)}55%{transform:translateX(24px) scale(1.08)}100%{transform:translateX(0)}}
@keyframes hitFlash{0%,100%{filter:none}45%{filter:brightness(3) sepia(1) saturate(2)}}
@keyframes criticalShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.battle-log{flex-shrink:0}.battle-actions{flex-shrink:0}
@media(max-height:700px){.battle-head{margin-bottom:6px}.battle-scene{min-height:190px}.battle-log{height:52px;padding:7px}.battle{padding-top:calc(8px + env(safe-area-inset-top))}}
</style>
</head>
<body><main class="app">
<header class="top"><div><div class="brand">萬道仙途</div><div class="realm" id="realm">練氣期・初入仙途</div></div><div class="power">目前戰力<b id="power">12,680</b></div></header>
<section class="view" id="view"></section>
<nav class="nav" id="nav">
<button class="active" data-page="home"><span>⌂</span>洞府</button><button data-page="gear"><span>✧</span>裝備</button><button data-page="bag"><span>▤</span>背包</button><button data-page="shop"><span>◇</span>商店</button>
</nav>
<section class="battle" id="battle">
<div class="battle-head"><button class="secondary" id="leave">離開秘境</button><b id="day">第 1 / 30 日</b><button class="secondary" id="pause">暫停</button></div>
<div class="battle-scene"><svg viewBox="0 0 520 700" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#283b42"/><stop offset="1" stop-color="#151113"/></linearGradient></defs><rect width="520" height="700" fill="url(#sky)"/><path d="M0 350L90 190 170 330 265 120 370 330 455 180 520 340V700H0Z" fill="#27302f"/><path d="M0 440L130 300 230 430 350 270 520 450V700H0Z" fill="#17191a"/><path d="M220 700Q250 540 260 420Q275 560 330 700" fill="#6c4930" opacity=".35"/></svg><div class="combatants"><div class="fighter"><div class="sigil"><img src="assets/player_sword.png" alt="修仙者"></div><small>修仙者</small><div class="bar"><i id="hpbar" style="width:100%"></i></div></div><div class="fighter"><div class="sigil" id="foe"><img id="foeimg" src="assets/enemy_demon.png" alt="妖獸"></div><small id="foename">山林妖狼</small><div class="bar"><i id="foebar" style="width:100%;background:#9e2a2b"></i></div></div></div></div>
<div class="battle-log" id="log">踏入秘境，靈氣湧動。</div><div class="battle-actions"><button class="secondary" id="speed">速度 1x</button><button class="primary" id="manualPause">暫停歷練</button></div></section>
<div class="modal" id="modal"><div class="modal-card" id="modalcard"></div></div>
</main>
<script>
const $=id=>document.getElementById(id);let page='home',sub='裝備',day=1,speed=1,paused=false,timer=null,turn=null,hp=100,enemyHp=100,coins=1200,stones=35,power=12680,inventory=['凝氣丹','青銅碎片','靈石袋'],owned={裝備:[],靈寶:[],靈寵:[],坐騎:[]};
const svgHero='<svg viewBox="0 0 180 300" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="robe" x2="1" y2="1"><stop stop-color="#e4dfd1"/><stop offset=".5" stop-color="#728c91"/><stop offset="1" stop-color="#25383e"/></linearGradient></defs><ellipse cx="90" cy="285" rx="65" ry="10" fill="#000" opacity=".5"/><path d="M68 62Q40 18 79 13Q128 10 111 67L125 95 146 263 91 281 35 263 52 97Z" fill="#171516"/><path d="M68 58Q89 43 111 61L129 111 155 265 91 280 25 265 52 110Z" fill="url(#robe)" stroke="#c7ad83" stroke-width="2"/><path d="M71 67L90 112 110 67 97 265 83 265Z" fill="#d9c6a3"/><path d="M70 57Q90 37 110 57L105 83 76 83Z" fill="#e6c6a1"/><ellipse cx="90" cy="47" rx="23" ry="27" fill="#e0c0a0"/><path d="M67 43Q67 4 97 12Q125 18 113 54L104 31 77 29Z" fill="#151316"/><path d="M54 115L15 222 37 234 74 146M126 115L165 220 143 233 106 146" fill="#a7b8b0" stroke="#c7ad83" stroke-width="2"/><path d="M88 112L80 265M95 112L106 265" stroke="#b18b5f" stroke-width="2"/></svg>';
const fox='<svg viewBox="0 0 100 100"><path d="M18 54L8 15 38 35Q50 22 63 35L91 12 82 58Q78 88 51 90Q23 86 18 54Z" fill="#eee2ce" stroke="#a67b52" stroke-width="3"/><path d="M32 57Q50 44 68 57L61 72 50 77 38 70Z" fill="#d8a46e"/><circle cx="39" cy="52" r="3"/><circle cx="62" cy="52" r="3"/></svg>';
function render(){ $('power').textContent=power.toLocaleString();$('view').innerHTML=page==='home'?home():page==='gear'?gear():page==='bag'?bag():shop();document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));}
function home(){return `<div class="hero-scene"><svg class="scene-art" viewBox="0 0 520 380" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="mountsky" x2="0" y2="1"><stop stop-color="#31484b"/><stop offset="1" stop-color="#17191a"/></linearGradient><linearGradient id="water" x2="0" y2="1"><stop stop-color="#9bb6a9"/><stop offset="1" stop-color="#263f40"/></linearGradient></defs><rect width="520" height="380" fill="url(#mountsky)"/><circle cx="400" cy="70" r="43" fill="#d8b88a" opacity=".65"/><path d="M0 210L95 70 174 192 278 36 390 200 470 88 520 180V380H0Z" fill="#33413c"/><path d="M0 260L125 143 210 245 326 120 430 250 520 155V380H0Z" fill="#202c2a"/><path d="M270 110Q255 200 290 300" stroke="url(#water)" stroke-width="15" fill="none" opacity=".8"/><path d="M0 300Q130 250 250 310T520 290V380H0Z" fill="#15191a"/><path d="M25 275L95 245 155 275 155 320 25 320Z" fill="#4b3729"/><path d="M45 240L90 205 135 240Z" fill="#b68b5e"/><path d="M365 270L425 230 485 270 485 320 365 320Z" fill="#403126"/></svg><div class="scene-shade"></div><div class="hero-name"><strong>雲隱洞府</strong>練氣九層・修行者</div><div class="hero-figure"><img class="asset-sprite" src="assets/player_sword.png" alt="劍修"></div><div class="pet-mini"><img src="assets/pet_ice_fox.png" alt="雪尾靈狐"></div><div class="mount-label">御風飛劍・靈狐同行</div></div><div class="stat-strip"><div class="stat"><small>生命</small><b>2,480</b></div><div class="stat"><small>攻擊</small><b>860</b></div><div class="stat"><small>防禦</small><b>320</b></div></div><button class="dungeon" onclick="startBattle()"><span><b>踏入青雲秘境</b><small>30 日歷練・自動戰鬥・奇遇探索</small></span><span class="primary">進入</span></button><div class="section-title">修行概況 <small>角色與裝備整合展示</small></div><div class="panel"><div class="row"><b>目前境界：練氣九層</b><span class="muted">距離築基 72%</span></div><div class="bar"><i style="width:72%"></i></div><div class="row muted"><span>修為 7,200 / 10,000</span><span>靈石 ${coins}</span></div></div><div class="section-title">快捷養成 <small>點擊進入裝備中心</small></div><div class="quick-grid"><button class="quick" onclick="goGear('裝備')"><span class="glyph">⚔</span>穿戴裝備</button><button class="quick" onclick="goGear('靈寵')"><span class="glyph">狐</span>靈寵出戰</button><button class="quick" onclick="goGear('坐騎')"><span class="glyph">劍</span>飛行法器</button></div>`;}
function goGear(s){page='gear';sub=s;render()}
function gear(){let data={裝備:[['青鋒劍','攻擊 +120','提升飛劍連擊傷害','劍'],['玄鐵靈甲','防禦 +85','受到傷害降低','甲'],['流雲靴','速度 +8%','提升戰鬥先手','靴'],['聚氣玉佩','修為 +10%','歷練修為增加','玉']],靈寶:[['乾坤塔','生命 +8%','永久增加最大生命','塔'],['斬仙葫','暴擊 +5%','提升暴擊機率','葫'],['聚靈珠','修為 +12%','增加修為獲取','珠'],['鎮魂鐘','抵抗 +6%','降低控制效果','鐘']],靈寵:[['雪尾靈狐','暴擊連攜','攻擊時機率追加追擊','狐'],['雷紋幼蛟','雷傷 +10%','技能追加雷電傷害','蛟'],['玄甲靈龜','護盾 +8%','戰鬥開始獲得護盾','龜']],坐騎:[['御風飛劍','攻擊 +5%','御劍飛行，提升攻擊','劍'],['九品金蓮','生命 +8%','蓮台護體，提升生命','蓮'],['紫金葫蘆','修為 +10%','加快歷練修為獲取','葫'],['凌霄仙舟','靈石 +8%','增加秘境靈石收益','舟']]};return `<div class="section-title"><b>仙家養成中心</b><small>收藏・培養・構築</small></div><div class="tabs">${Object.keys(data).map(x=>`<button class="${sub===x?'on':''}" onclick="goGear('${x}')">${x}</button>`).join('')}</div>${sub==='裝備'?'<div class="panel"><b>角色穿戴</b><p class="muted">目前戰力 '+power.toLocaleString()+' ・點選部位查看可替換裝備</p><div class="slot-grid"><div class="slot"><b>主武器</b>青鋒劍</div><div class="slot"><b>護甲</b>玄鐵甲</div><div class="slot"><b>頭飾</b>雲紋冠</div><div class="slot"><b>鞋履</b>流雲靴</div><div class="slot"><b>玉佩</b>聚氣玉佩</div><div class="slot"><b>法器</b>護心鏡</div></div></div>':''}<div class="item-grid">${data[sub].map((it,i)=>`<div class="item"><div class="art">${it[3]}</div><h3>${it[0]}</h3><p>${it[1]}<br>${it[2]}</p><button class="secondary" onclick="upgrade('${sub}','${it[0]}')">${sub==='裝備'?'強化':sub==='靈寶'?'升星':sub==='靈寵'?'培養':'升級'}</button></div>`).join('')}</div>`;}
function bag(){return `<div class="section-title">儲物袋 <small>靈材與冒險收穫</small></div><div class="panel row"><span>靈石</span><b>${coins}</b></div><div class="panel row"><span>仙玉</span><b>${stones}</b></div><div class="item-grid">${['凝氣丹','青銅碎片','靈石袋','妖狼獠牙','秘境令牌','靈寶碎片'].map((x,i)=>`<div class="item"><div class="art">${['丹','礦','石','牙','令','寶'][i]}</div><h3>${x}</h3><p>修仙歷練收集材料</p><span class="muted">持有 ${i<3?inventory.filter(v=>v===x).length+1:0}</span></div>`).join('')}</div>`;}
function shop(){return `<div class="section-title">萬寶商行 <small>每日貨品輪替</small></div><div class="item-grid">${[['凝氣丹','恢復歷練狀態',80],['靈寶碎片','靈寶升星材料',160],['秘境令牌','挑戰秘境使用',120],['青銅寶箱','隨機裝備材料',200]].map(x=>`<div class="item"><div class="art">寶</div><h3>${x[0]}</h3><p>${x[1]}</p><button class="secondary" onclick="buy('${x[0]}',${x[2]})">購買 ${x[2]} 靈石</button></div>`).join('')}</div>`;}
function upgrade(type,name){if(coins<100){toast('靈石不足');return}coins-=100;power+=type==='裝備'?120:type==='靈寶'?80:50;render();toast(name+'培養成功，戰力提升');}
function buy(name,cost){if(coins<cost){toast('靈石不足');return}coins-=cost;inventory.push(name);render();toast('已購入'+name)}
function toast(t){$('log').textContent=t;}
function modal(title,desc,choices){$('modalcard').innerHTML='<h2>'+title+'</h2><div class="muted">'+desc+'</div>'+choices.map(c=>'<button class="choice" onclick="'+c.fn+'"><b>'+c.name+'</b><small>'+c.desc+'</small></button>').join('');$('modal').classList.add('show')}
function startBattle(){day=1;hp=100;enemyHp=100;paused=false;$('battle').classList.add('show');$('nav').classList.add('hidden');battleRender();runTimer();}
function battleRender(){$('day').textContent='第 '+day+' / 30 日';$('hpbar').style.width=hp+'%';$('foebar').style.width=enemyHp+'%';$('foeimg').src=day===30?'assets/enemy_wraith.png':day===15?'assets/enemy_witch.png':'assets/enemy_demon.png';$('foename').textContent=day===30?'秘境首領':day===15?'精英妖王':'山林妖獸';}
function runTimer(){clearInterval(timer);clearInterval(turn);timer=setInterval(()=>{if(paused)return;day++;if(day===15||day===30){paused=true;battleRender();modal(day===15?'精英現身':'秘境首領','強敵阻路，選擇應戰策略。',[{name:'全力迎戰',desc:'攻擊提升，承受少量傷害',fn:'closeModal();fightBoss()'},{name:'穩守反擊',desc:'恢復生命並降低受傷',fn:'hp=Math.min(100,hp+25);closeModal();fightBoss()'}]);return}if(day>30){finishBattle();return}battleRender();$('log').textContent='第 '+day+' 日：深入秘境探索。';if(day%5===0)coins+=30;},1500/speed);}
function fightBoss(){paused=false;turn=setInterval(()=>{if(paused)return;enemyHp-=18+Math.random()*12;hp-=8+Math.random()*9;battleRender();$('log').textContent='飛劍破空，交鋒中！';if(enemyHp<=0){clearInterval(turn);enemyHp=100;if(day===30){finishBattle();return}day++;battleRender();$('log').textContent='強敵已伏，繼續前進。'}if(hp<=0){clearInterval(turn);finishBattle(true)}},500);}
function closeModal(){$('modal').classList.remove('show')}
function finishBattle(fail=false){clearInterval(timer);clearInterval(turn);paused=true;modal(fail?'歷練中止':'秘境歷練完成',fail?'氣血耗盡，先回洞府休整。':'三十日歷練結束，收穫靈石與材料。',[{name:'領取獎勵並返回',desc:'獲得靈石、修為與秘境材料',fn:'coins+=260;power+=180;closeModal();endBattle()'}]);}
function endBattle(){$('battle').classList.remove('show');$('nav').classList.remove('hidden');page='home';render()}
$('nav').addEventListener('click',e=>{let b=e.target.closest('button[data-page]');if(b){page=b.dataset.page;render()}});
$('leave').onclick=()=>{clearInterval(timer);clearInterval(turn);closeModal();endBattle()};
$('pause').onclick=$('manualPause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'繼續':'暫停';$('manualPause').textContent=paused?'繼續歷練':'暫停歷練';};
$('speed').onclick=()=>{speed=speed===1?2:1;$('speed').textContent='速度 '+speed+'x';runTimer()};

const assetCatalog={players:{sword:'assets/player_sword.png',mage:'assets/player_mage.png',body:'assets/player_body.png'},pets:{iceFox:'assets/pet_ice_fox.png',fireFox:'assets/pet_fire_fox.png',turtle:'assets/pet_turtle.png'},enemies:{demon:'assets/enemy_demon.png',witch:'assets/enemy_witch.png',wraith:'assets/enemy_wraith.png'}};

/* Stable expedition loop and animated auto-combat */
(function(){
 const originalFinish=finishBattle;
 let encounterBusy=false;
 function combatTick(isBoss){
   if(encounterBusy)return; encounterBusy=true;
   clearInterval(timer);clearInterval(turn);paused=false;
   let rounds=0;
   const enemyName=isBoss?(day===30?'秘境首領':'精英妖王'):'秘境妖獸';
   $('foename').textContent=enemyName;
   turn=setInterval(()=>{
     if(paused)return;
     rounds++;
     const player=document.querySelector('.fighter:first-child');
     const foe=document.querySelector('.fighter:last-child');
     const scene=document.querySelector('.battle-scene');
     if(player){player.classList.remove('strike');void player.offsetWidth;player.classList.add('strike');}
     const crit=Math.random()<.16;
     const damage=18+Math.random()*14+(crit?22:0)+(talentOwned.includes('飛劍連擊')?8:0);
     enemyHp-=damage;
     if(foe){foe.classList.remove('hit');void foe.offsetWidth;foe.classList.add('hit');}
     if(crit&&scene){scene.classList.add('critical');setTimeout(()=>scene.classList.remove('critical'),260);}
     hp-=Math.max(2,7+Math.random()*8-(talentOwned.includes('氣血淬體')?3:0));
     if(talentOwned.includes('天雷引')&&rounds%3===0)enemyHp-=24;
     hp=Math.max(0,hp);enemyHp=Math.max(0,enemyHp);battleRender();
     $('log').textContent=crit?'暴擊！劍氣貫穿敵陣':talentOwned.includes('天雷引')&&rounds%3===0?'天雷落下，連鎖轟擊':'飛劍交鋒，靈光迸發';
     if(enemyHp<=0){
       clearInterval(turn);encounterBusy=false;enemyHp=100;
       if(isBoss&&day===30){originalFinish(false);return;}
       if(isBoss){$('log').textContent='精英伏誅，繼續前行';day++;}
       else $('log').textContent='妖獸退散，繼續探索';
       battleRender();runTimer();
     }else if(hp<=0){clearInterval(turn);encounterBusy=false;originalFinish(true);}
   },500);
 }
 runTimer=function(){
   clearInterval(timer);clearInterval(turn);encounterBusy=false;
   timer=setInterval(()=>{
     if(paused||encounterBusy)return;
     day++;
     if(day>30){originalFinish(false);return;}
     cultivation+=120;if(day%4===0)coins+=35;
     battleRender();
     $('log').textContent='第 '+day+' 日：深入秘境';
     saveGame();
     if(day===15||day===30){$('foeimg').src=day===30?'assets/enemy_wraith.png':'assets/enemy_witch.png';combatTick(true);return;}
     if([5,10,20,25].includes(day)){showTalent();return;}
     if([8,22].includes(day)){showEncounter();return;}
     if([12,24].includes(day)){showLoot();return;}
     if(Math.random()<.34){$('foeimg').src='assets/enemy_demon.png';combatTick(false);}
   },1500/speed);
 };
 const oldBoss=fightBoss;
 fightBoss=function(){combatTick(true);};
 const oldStart=startBattle;
 startBattle=function(){
   day=1;hp=100;enemyHp=100;paused=false;encounterBusy=false;
   $('battle').classList.add('show');$('nav').classList.add('hidden');
   $('foeimg').src='assets/enemy_demon.png';battleRender();
   $('log').textContent='踏入秘境，歷練開始';
   runTimer();
 };
 $('leave').onclick=()=>{clearInterval(timer);clearInterval(turn);encounterBusy=false;closeModal();endBattle();};
 $('speed').onclick=()=>{speed=speed===1?2:1;$('speed').textContent='速度 '+speed+'x';if(!encounterBusy&&!paused)runTimer();};
 $('pause').onclick=$('manualPause').onclick=()=>{
   paused=!paused;
   $('pause').textContent=paused?'繼續':'暫停';
   $('manualPause').textContent=paused?'繼續歷練':'暫停歷練';
   if(!paused&&!encounterBusy)runTimer();
 };
 const artCheck=()=>{
   document.querySelectorAll('img[src^="assets/"]').forEach(img=>{
     img.onerror=()=>{img.style.visibility='hidden';img.setAttribute('aria-label','素材尚未上傳');};
   });
 };
 const prevRender=render;render=function(){prevRender();artCheck();};
 artCheck();
})();

 };

   }
   return out;
 };
 window.choosePet=function(k){if(!assetCatalog.pets[k])return;equipped.pet=k;saveEquip();render();};
 window.chooseMount=function(n){equipped.mount=n;saveEquip();render();};
 const oldStart=startBattle;
 startBattle=function(){oldStart();const p=document.querySelector('.fighter:first-child .sigil img');if(p)p.src=playerArt();};
 const oldBattleRender=battleRender;
 battleRender=function(){oldBattleRender();const p=document.querySelector('.fighter:first-child .sigil img');if(p)p.src=playerArt();};
 const style=document.createElement('style');
 style.textContent='.hero-figure img{animation:floatSpirit 3s ease-in-out infinite}.pet-mini img{animation:floatSpirit 2.5s ease-in-out infinite}@keyframes floatSpirit{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}.tabs{flex-wrap:wrap}.tabs button{min-height:36px}';
 document.head.appendChild(style);
 saveEquip();
})();
